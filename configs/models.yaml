# Model registry. Load by LOCAL PATH only — never by HF repo id, so that a
# stray network lookup cannot even be attempted on an offline compute node.
# `revision` is filled in by scripts/download_models.sh after the download.

models:
  - short_name: Qwen2.5-7B-Instruct
    hf_repo: Qwen/Qwen2.5-7B-Instruct
    local_path: models/Qwen2.5-7B-Instruct
    max_context: 32768
    dtype: bfloat16
    gated: false
    revision: null

  - short_name: Llama-3.1-8B-Instruct
    hf_repo: meta-llama/Llama-3.1-8B-Instruct
    local_path: models/Llama-3.1-8B-Instruct
    max_context: 131072
    dtype: bfloat16
    gated: true
    revision: null

  - short_name: Mistral-7B-Instruct-v0.3
    hf_repo: mistralai/Mistral-7B-Instruct-v0.3
    local_path: models/Mistral-7B-Instruct-v0.3
    max_context: 32768
    dtype: bfloat16
    gated: true
    revision: null

  # 4096-token context. The story alone exceeds it around N=T~=20.
  # Overflowing prompts are recorded with context_overflow=true and SKIPPED,
  # never generated and never counted as wrong. See CLAUDE.md.
  - short_name: OLMo-2-1124-7B-Instruct
    hf_repo: allenai/OLMo-2-1124-7B-Instruct
    local_path: models/OLMo-2-1124-7B-Instruct
    max_context: 4096
    dtype: bfloat16
    gated: false
    revision: null
